  _setOCRFormat(format, el) {
    this._state.ocrOutputFormat = format;
    document.querySelectorAll('[data-cmd="setOCRFormat"]').forEach(b => b.classList.remove('active'));
    if (el) el.classList.add('active');
    this._renderOCRResult();
  }

  _setOCRMaxDim(dim, el) {
    this._state.ocrMaxDim = dim;
    localStorage.setItem('lens_mimo_dim', String(dim));
    document.querySelectorAll('[data-cmd="setOCRMaxDim"]').forEach(b => b.classList.remove('active'));
    if (el) el.classList.add('active');
  }

  _loadOCRConfig() {
    const savedProvider = localStorage.getItem('lens_ocr_provider');
    if (savedProvider && LensApp.OCR_PROVIDERS.some(p => p.id === savedProvider)) {
      this._state.ocrProvider = savedProvider;
    }
    this._populateProviderSelect();
    const pid = this._state.ocrProvider;
    const prov = LensApp.OCR_PROVIDERS.find(p => p.id === pid);
    let key = localStorage.getItem(this._storageKey(pid, 'key'));
    let base = localStorage.getItem(this._storageKey(pid, 'base'));
    let model = localStorage.getItem(this._storageKey(pid, 'model'));
    let auth = localStorage.getItem(this._storageKey(pid, 'auth'));
    if (pid === 'mimo') {
      if (!key) key = localStorage.getItem('lens_mimo_key');
      if (!base) base = localStorage.getItem('lens_mimo_base') || prov.baseUrl;
      if (!model) model = prov.model;
      if (!auth) auth = 'api-key';
    }
    if (!model) model = prov ? prov.model : '';
    if (!auth) auth = prov ? prov.authHeader : 'authorization';
    this._el.mimoKeyInput.value = key || '';
    this._el.mimoBaseUrlInput.value = base || (prov ? prov.baseUrl : '');
    this._el.mimoModelInput.value = model;
    this._el.mimoAuthHeader.value = auth;
    const remembered = !!key;
    this._el.mimoRemember.checked = remembered;
    this._el.mimoStatus.textContent = remembered ? '✓ Key 已加载' : '等待输入 Key';
    this._updateInputPlaceholders(prov);
    const dim = parseInt(localStorage.getItem('lens_mimo_dim')) || 2048;
    this._state.ocrMaxDim = dim;
    document.querySelectorAll('[data-cmd="setOCRMaxDim"]').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.dim) === dim);
    });
    this._updateApiStatusDot();
  }

  _updateInputPlaceholders(prov) {
    if (!prov) prov = LensApp.OCR_PROVIDERS.find(p => p.id === this._state.ocrProvider) || null;
    this._el.mimoKeyInput.placeholder = prov ? `API Key (${prov.keyPrefix})` : 'API Key';
    this._el.mimoBaseUrlInput.placeholder = prov ? `Base URL (如 ${prov.baseUrl})` : 'Base URL (OpenAI 兼容)';
    this._el.mimoModelInput.placeholder = prov ? `模型 (如 ${prov.model})` : '模型名';
  }

  _updateApiStatusDot() {
    const el = this._el.apiStatusDot;
    if (!el) return;
    const pid = this._state.ocrProvider;
    const stored = localStorage.getItem(this._storageKey(pid, 'key')) ||
      (pid === 'mimo' ? localStorage.getItem('lens_mimo_key') : '');
    const hasKey = !!(stored || this._el.mimoKeyInput.value.trim());
    el.style.display = '';
    el.className = `w-2 h-2 rounded-full ${hasKey ? 'bg-[var(--accent)]' : 'bg-gray-500'}`;
  }

  _openOCRConfig() {
    this._loadOCRConfig();
    this._state.ocrBatchResults = [];
    this._state.ocrBatchIndex = 0;
    this._el.ocrText.value = '';
    this._el.ocrModal.classList.add('active');
    setTimeout(() => this._el.mimoKeyInput.focus(), 50);
  }

  _saveOCRConfig() {
    if (!this._el.mimoRemember.checked) return;
    const pid = this._state.ocrProvider;
    const key = this._el.mimoKeyInput.value.trim();
    const base = this._el.mimoBaseUrlInput.value.trim();
    const model = this._el.mimoModelInput.value.trim();
    const auth = this._el.mimoAuthHeader.value;
    if (!key) return;
    localStorage.setItem(this._storageKey(pid, 'key'), key);
    localStorage.setItem(this._storageKey(pid, 'base'), base);
    localStorage.setItem(this._storageKey(pid, 'model'), model);
    localStorage.setItem(this._storageKey(pid, 'auth'), auth);
    localStorage.setItem('lens_ocr_provider', pid);
    if (pid === 'mimo') {
      localStorage.setItem('lens_mimo_key', key);
      localStorage.setItem('lens_mimo_base', base);
    }
    this._updateApiStatusDot();
  }

  async _callOCR(dataUrl) {
    const key = this._el.mimoKeyInput.value.trim();
    if (!key) throw new Error('请先输入 API Key');
    const base = this._el.mimoBaseUrlInput.value.trim().replace(/\/+$/, '');
    const model = this._el.mimoModelInput.value.trim();
    const authHeader = this._el.mimoAuthHeader.value;
    const pid = this._state.ocrProvider;
    const prov = LensApp.OCR_PROVIDERS.find(p => p.id === pid);
    const maxTokens = prov ? prov.maxTokens : 8192;
    this._saveOCRConfig();
    const start = Date.now();
    const src = await this._downscaleForOCR(dataUrl, this._state.ocrMaxDim);
    this._el.ocrTokenEstimate.textContent = `≈ ${this._state.lastOCRTokenEstimate} 图片Token`;
    const sysPrompt =
      '你是一个精准的多模态 OCR 引擎。请完整识别图片中的所有文字并返回结构化 JSON。只返回 JSON，不要任何解释、注释或 Markdown 代码块。\n' +
      '返回格式（bbox 为 0~1 归一化坐标 [x0,y0,x1,y1]，以图片左上角为原点，未知字段填 null）：\n' +
      '{"text":"按阅读顺序的纯文本，保留原始换行","markdown":"按阅读顺序的 Markdown 排版（标题用 #，表格用 | 语法）","blocks":[{"type":"title|paragraph|table|kv|list","text":"该块文字","bbox":[x0,y0,x1,y1]}],"tables":[{"rows":[["单元格","单元格"]]}],"kv_pairs":[{"key":"键","value":"值"}]}';
    const headers = { 'Content-Type': 'application/json' };
    if (authHeader === 'authorization') headers['Authorization'] = 'Bearer ' + key;
    else headers[authHeader] = key;
    const body = {
      model,
      messages: [
        { role: 'system', content: sysPrompt },
        { role: 'user', content: [
          { type: 'image_url', image_url: { url: src } },
          { type: 'text', text: '请对这张图片执行 OCR，返回完整结构化 JSON。' }
        ]}
      ],
      response_format: { type: 'json_object' },
      max_completion_tokens: maxTokens
    };
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 120000);
    let res;
    try {
      res = await fetch(`${base}/chat/completions`, {
        method: 'POST', headers, body: JSON.stringify(body), signal: ctrl.signal
      });
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('OCR 超时 (120s)');
      throw new Error('网络请求失败: ' + e.message);
    } finally { clearTimeout(timer); }
    if (!res.ok) {
      let msg = `API ${res.status}`;
      if (res.status === 401) msg = 'API Key 无效，请检查';
      else if (res.status === 402) msg = '余额不足或套餐额度已用尽';
      else if (res.status === 429) msg = '请求过于频繁，请稍后重试';
      else if (res.status >= 500) msg = '服务异常，请稍后重试';
      const errBody = await res.text().catch(() => '');
      throw new Error(`${msg}: ${errBody.slice(0, 150)}`);
    }
    const data = await res.json();
    const content = data.choices?.[0]?.message?.content || '';
    const parsed = this._extractJSON(content);
    const tokens = data.usage?.total_tokens || 0;
    return {
      text: (parsed && parsed.text) || content,
      markdown: (parsed && parsed.markdown) || '',
      blocks: (parsed && Array.isArray(parsed.blocks)) ? parsed.blocks : [],
      tables: (parsed && Array.isArray(parsed.tables)) ? parsed.tables : [],
      kv_pairs: (parsed && Array.isArray(parsed.kv_pairs)) ? parsed.kv_pairs : [],
      tokens, time: (Date.now() - start) / 1000
    };
  }

  _extractJSON(content) {
    if (!content) return null;
    let str = content.trim();
    const f = str.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (f) str = f[1].trim();
    try { return JSON.parse(str); } catch (e) { return null; }
  }

  async _downscaleForOCR(dataUrl, maxDim) {
    const img = await this._loadImage(dataUrl);
    let w = img.width, h = img.height;
    let src = dataUrl;
    if (w > maxDim || h > maxDim) {
      const scale = maxDim / Math.max(w, h);
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      src = c.toDataURL('image/jpeg', 0.9);
    }
    this._state.lastOCRTokenEstimate = Math.max(8, Math.round((w * h) / 1024));
    return src;
  }

  async _recognizeText() {
    const s = this._state;
    if (s.isOCRProcessing) { this._showToast('正在识别中，请稍候...'); return; }
    if (!this._el.mimoKeyInput.value.trim()) { this._showToast('请先输入 API Key'); this._el.mimoKeyInput.focus(); return; }
    s.isOCRProcessing = true;
    this._showProcessing('调用 OCR 引擎识别中...');
    try {
      const src = s.currentImage || this._el.previewCanvas.toDataURL('image/jpeg', 0.92);
      const r = await this._callOCR(src);
      s.ocrBatchResults = [{ id: 0, fileName: '预览图', ...r }];
      s.ocrBatchIndex = 0;
      this._openOCRModal();
      this._showToast(r.text.trim() ? `识别完成 ${r.time.toFixed(2)}秒` : '未识别到文字');
    } catch (e) { console.error(e); this._showToast('OCR 失败: ' + e.message); }
    finally { s.isOCRProcessing = false; this._hideProcessing(); }
  }

  async _batchOCR() {
    const s = this._state;
    if (s.isOCRProcessing) { this._showToast('正在识别中，请稍候...'); return; }
    if (!this._el.mimoKeyInput.value.trim()) { this._showToast('请先输入 API Key'); this._el.mimoKeyInput.focus(); return; }
    const selected = s.capturedImages.filter(i => s.selectedIds.has(i.id));
    const targets = selected.length ? selected : [...s.capturedImages];
    if (!targets.length) { this._showToast('没有可识别的图片'); return; }
    s.isOCRProcessing = true;
    const results = [];
    const CONCURRENCY = 3;
    let done = 0, failed = 0;
    const processOne = async (img) => {
      try {
        const r = await this._callOCR(img.data);
        results.push({ id: img.id, fileName: img.displayName || img.fileName, ...r });
        img.ocrText = r.text;
        img.ocrJson = JSON.stringify(r, null, 2);
        img.ocrMarkdown = r.markdown;
        this._saveToDB(img);
        done++;
      } catch (e) {
        console.error(`OCR ${img.displayName} 失败:`, e);
        failed++;
        results.push({ id: img.id, fileName: img.displayName || img.fileName, error: e.message });
      }
    };
    for (let i = 0; i < targets.length; i += CONCURRENCY) {
      const batch = targets.slice(i, i + CONCURRENCY);
      this._showProcessing(`识别中 ${Math.min(i + CONCURRENCY, targets.length)}/${targets.length}`);
      await Promise.all(batch.map(processOne));
      await new Promise(r => setTimeout(r, 0));
    }
    this._hideProcessing();
    s.isOCRProcessing = false;
    s.ocrBatchResults = results;
    s.ocrBatchIndex = 0;
    this._openOCRModal();
    this._showToast(`识别完成 ${done}/${targets.length}` + (failed ? `，${failed} 张失败` : ''));
  }

  _openOCRModal() {
    this._renderOCRResult();
    this._el.ocrModal.classList.add('active');
  }

  _renderOCRResult() {
    const s = this._state;
    const results = s.ocrBatchResults;
    if (!results.length) return;
    const idx = Math.max(0, Math.min(s.ocrBatchIndex, results.length - 1));
    s.ocrBatchIndex = idx;
    const r = results[idx];
    const el = this._el;
    el.ocrFileName.textContent = r.error ? `✗ ${r.fileName}` : r.fileName;
    el.ocrModalTitle.textContent = 'OCR文字识别';
    if (results.length > 1) {
      el.ocrBatchBar.style.display = '';
      el.ocrBatchName.textContent = r.fileName;
      el.ocrBatchCounter.textContent = `[${idx + 1}/${results.length}]`;
      el.ocrPrevBtn.classList.toggle('active', idx > 0);
      el.ocrNextBtn.classList.toggle('active', idx < results.length - 1);
    } else {
      el.ocrBatchBar.style.display = 'none';
    }
    if (r.error) {
      el.ocrText.value = `识别失败: ${r.error}`;
      el.ocrCharCount.textContent = '字符:0';
      el.ocrTime.textContent = '用时:--';
      el.ocrTokens.style.display = 'none';
      return;
    }
    const format = s.ocrOutputFormat;
    let text = r.text || '';
    if (format === 'markdown') text = r.markdown || r.text || '';
    else if (format === 'json') text = JSON.stringify({ fileName: r.fileName, text: r.text, markdown: r.markdown, blocks: r.blocks, tables: r.tables, kv_pairs: r.kv_pairs }, null, 2);
    el.ocrText.value = text;
    el.ocrCharCount.textContent = `字符:${text.length}`;
    el.ocrTime.textContent = `用时:${r.time ? r.time.toFixed(2) : 0}s`;
    el.ocrTokens.textContent = `Token:${r.tokens || 0}`;
    el.ocrTokens.style.display = '';
  }

  _ocrPrev() {
    if (this._state.ocrBatchIndex <= 0) return;
    this._state.ocrBatchIndex--;
    this._renderOCRResult();
  }

  _ocrNext() {
    if (this._state.ocrBatchIndex >= this._state.ocrBatchResults.length - 1) return;
    this._state.ocrBatchIndex++;
    this._renderOCRResult();
  }

  _closeOCR() { this._el.ocrModal.classList.remove('active'); }

  _copyOCRText() {
    const ta = this._el.ocrText;
    ta.select();
    document.execCommand('copy');
    this._showToast('已复制');
  }

  _getCurrentResult() {
    const results = this._state.ocrBatchResults;
    if (!results.length) return null;
    return results[this._state.ocrBatchIndex];
  }

  _downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  _saveOCRText() {
    const text = this._el.ocrText.value;
    if (!text.trim()) return;
    this._downloadBlob(new Blob([text], { type: 'text/plain' }), `OCR_${Date.now()}.txt`);
  }

  _exportOCRMarkdown() {
    const r = this._getCurrentResult();
    if (!r || r.error) { this._showToast('没有可导出的结果'); return; }
    const md = `# ${r.fileName}\n\n${r.markdown || r.text || ''}`;
    this._downloadBlob(new Blob([md], { type: 'text/markdown' }), `OCR_${r.fileName.replace(/\.[^.]+$/, '')}_${Date.now()}.md`);
  }

  _exportOCRJSON() {
    const r = this._getCurrentResult();
    if (!r || r.error) { this._showToast('没有可导出的结果'); return; }
    const json = JSON.stringify({ fileName: r.fileName, text: r.text, markdown: r.markdown, blocks: r.blocks, tables: r.tables, kv_pairs: r.kv_pairs, tokens: r.tokens, time: r.time }, null, 2);
    this._downloadBlob(new Blob([json], { type: 'application/json' }), `OCR_${r.fileName.replace(/\.[^.]+$/, '')}_${Date.now()}.json`);
  }

  _exportAllOCR() {
    const results = this._state.ocrBatchResults;
    if (!results.length) { this._showToast('没有结果'); return; }
    const format = this._state.ocrOutputFormat;
    const ok = results.filter(r => !r.error);
    if (format === 'json') {
      const json = JSON.stringify(ok.map(r => ({ fileName: r.fileName, text: r.text, markdown: r.markdown, blocks: r.blocks, tables: r.tables, kv_pairs: r.kv_pairs })), null, 2);
      this._downloadBlob(new Blob([json], { type: 'application/json' }), `OCR_批量_${Date.now()}.json`);
    } else if (format === 'markdown') {
      const md = ok.map(r => `# ${r.fileName}\n\n${r.markdown || r.text || ''}`).join('\n\n---\n\n');
      this._downloadBlob(new Blob([md], { type: 'text/markdown' }), `OCR_批量_${Date.now()}.md`);
    } else {
      const txt = ok.map(r => `【${r.fileName}】\n${r.text || ''}`).join('\n\n' + '='.repeat(40) + '\n\n');
      this._downloadBlob(new Blob([txt], { type: 'text/plain' }), `OCR_批量_${Date.now()}.txt`);
    }
    this._showToast(`已导出全部 (${ok.length}/${results.length})`);
  }

  async _exportOCRToPDF() {
    const r = this._getCurrentResult();
    if (!r || r.error) { this._showToast('没有可导出的结果'); return; }
    const text = r.markdown || r.text;
    if (!text.trim()) { this._showToast('没有文本'); return; }
    this._showProcessing('生成 PDF...');
    try {
      const { PDFDocument, StandardFonts, rgb } = PDFLib;
      const pdfDoc = await PDFDocument.create();
      const page = pdfDoc.addPage([595.28, 841.89]);
      const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
      const fontSize = 12, lh = fontSize * 1.2, margin = 50;
      const maxW = 595.28 - 2 * margin;
      const lines = this._splitText(text, font, fontSize, maxW);
      let y = 841.89 - margin;
      page.drawText('OCR识别结果', { x: margin, y, size: 16, font, color: rgb(0,0,0) });
      y -= 30;
      const provName = (LensApp.OCR_PROVIDERS.find(p => p.id === this._state.ocrProvider) || {}).name || this._state.ocrProvider;
      page.drawText(`识别时间: ${new Date().toLocaleString()} | 引擎: ${provName}`, { x: margin, y, size: 8, font, color: rgb(0.5,0.5,0.5) });
      y -= 20;
      page.drawLine({ start: { x: margin, y }, end: { x: 595.28 - margin, y }, thickness: 1, color: rgb(0.8,0.8,0.8) });
      y -= 20;
      for (const line of lines) {
        if (y < margin) { pdfDoc.addPage([595.28, 841.89]); y = 841.89 - margin; }
        page.drawText(line, { x: margin, y, size: fontSize, font, color: rgb(0,0,0) });
        y -= lh;
      }
      const bytes = await pdfDoc.save();
      this._downloadBlob(new Blob([bytes], { type: 'application/pdf' }), `OCR结果_${Date.now()}.pdf`);
      this._showToast('导出成功');
    } catch (e) { console.error(e); this._showToast('导出失败'); }
    finally { this._hideProcessing(); }
  }

  _splitText(text, font, fontSize, maxW) {
    const lines = [];
    for (const para of text.split('\n')) {
      const words = para.split(' ');
      let cur = '';
      for (const w of words) {
        const test = cur ? `${cur} ${w}` : w;
        if (font.widthOfTextAtSize(test, fontSize) <= maxW) cur = test;
        else { if (cur) lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      lines.push('');
    }
    return lines;
  }

  /* ====================== IndexedDB ====================== */
  _openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('lens-km', 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('images')) {
          db.createObjectStore('images', { keyPath: 'id' });
        }
      };
      req.onsuccess = () => { this._db = req.result; resolve(); };
      req.onerror = () => { console.warn('IndexedDB 不可用'); reject(req.error); };
    });
  }

  async _saveToDB(imgObj) {
    try {
      await this._dbReady;
      const tx = this._db.transaction('images', 'readwrite');
      tx.objectStore('images').put(imgObj);
      await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; });
    } catch (e) { console.warn('DB 保存失败', e); }
  }

  async _saveAllToDB() {
    try {
      await this._dbReady;
      const tx = this._db.transaction('images', 'readwrite');
      const store = tx.objectStore('images');
      store.clear();
      for (const img of this._state.capturedImages) store.put(img);
      await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; });
    } catch (e) { console.warn('DB 保存失败', e); }
  }

  async _restoreFromDB() {
    try {
      await this._dbReady;
      const tx = this._db.transaction('images', 'readonly');
      const req = tx.objectStore('images').getAll();
      const results = await new Promise((res, rej) => {
        req.onsuccess = () => res(req.result);
        req.onerror = rej;
      });
      if (results && results.length) {
        this._state.capturedImages = results;
        this._updateGalleryCount();
      }
    } catch (e) { console.warn('DB 恢复失败', e); }
  }
}

/* ====================== Init ====================== */
document.addEventListener('DOMContentLoaded', () => {
  window.app = new LensApp();
});

    console.log('SW 注册成功，作用域:', reg.scope);
  }).catch(err => {
    console.error('SW 注册失败:', err);
  });
}
